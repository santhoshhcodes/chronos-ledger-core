[tool.poetry]
name = "chronos-ledger"
version = "0.1.0"
description = "Multi-Tenant B2B Attendance & Automated Payroll SaaS Engine"
authors = ["Santhosh Kannan <santhoshkannan8@example.com>"]
readme = "README.md"
package-mode = false  # ◄── This stops Poetry from looking for a package folder

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.28.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.2.1"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.28" }
alembic = "^1.13.0"
aioodbc = "^0.5.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
redis = "^5.0.0"
structlog = "^24.1.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ---- Tooling Configurations ----
[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88